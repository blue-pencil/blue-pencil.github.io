  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    function toggleDarkMode() {
      const body = document.body;
      const isDark = body.getAttribute("data-theme") === "dark";
  
      if (isDark) {
        body.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
      } else {
        body.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
      }
    }
    window.onload = function () {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.setAttribute("data-theme", "dark");
      }
    };
  </script>    
  <style>
    body {
      font-family: "Pretendard GOV Variable", "Pretendard GOV", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      background-color: #faf9f5;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      color: #000;
      transition: background 0.3s ease, color 0.3s ease;
    }
    /* 다크 모드 적용 */
    body[data-theme="dark"] {
      background-color: #141414;
      color: #f0efea;
    }
    body[data-theme="dark"] .alt-nickname {
      color: #a0a0a0;
    }
    body[data-theme="dark"] .container {
      background-color: #191919;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .toggle-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px auto 10px auto;
    }
    .toggle-switch {
      width: 50px;
      height: 25px;
      background: #ccc;
      border-radius: 25px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    body[data-theme="dark"] .toggle-switch {
      background: #007FFF;
    }
    .toggle-handle {
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      transition: left 0.3s ease, background 0.3s ease;
    }
    body[data-theme="dark"] .toggle-handle {
      left: 27px;
      background: #f0efea;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f0efea;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
    }
    @media (max-width: 600px) {
      .container {
        width: 95%;
        max-width: 100%;
        padding: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    }
    .accent {

    }
    header {

      padding: 20px 0;
    }
    .logo {

      height: 100px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 10px auto;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .logo:hover {
    box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
    }
    .alt-nickname {

    section {

    h2 {

      font-weight: 600;
    }
    .service-button {
      display: inline-block;
      margin: 5px;
      padding: 10px 15px;

      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s, box-shadow 0.3s;
      width: 200px;
      text-align: center;
    }
    .service-button:hover {

    .discord { background-color: #5865F2; }

    .project { background-color: #007FFF; }
    @media (max-width: 600px) {

        margin: 10px auto;
        display: block;
      }
    }
    .footer-image {
      width: 100%;
      max-width: 80px;
      height: auto;

    }
    footer {
      text-align: center;
      margin-top: 40px;
      padding: 10px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
